---
layout: default
title: posts
---
{% if site.posts.size == 0 %}
<p style="font-family: Verdana, Arial, sans-serif; font-size: 13px; color: #888;">No posts yet.</p>
{% else %}
<ul style="list-style: none; margin: 0; padding: 0;">
  {% for post in site.posts %}
  <li style="display: flex; align-items: baseline; gap: 20px; padding: 10px 0; border-bottom: 1px solid #f0f0f0;">
    <time style="font-family: Verdana, Arial, sans-serif; font-size: 12px; color: #aaa; white-space: nowrap; flex-shrink: 0;">
      {{ post.date | date: "%Y-%m-%d" }}
    </time>
    <a href="{{ post.url }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
{% endif %}

---
layout: default
---
<article>
  <header style="margin-bottom: 32px;">
    <h1 style="font-size: 28px; line-height: 1.3; margin: 0 0 8px;">{{ page.title }}</h1>
    <time style="font-family: Verdana, Arial, sans-serif; font-size: 12px; color: #888;">
      {{ page.date | date: "%B %-d, %Y" }}
    </time>
    {% if page.tags.size > 0 %}
    <span style="font-family: Verdana, Arial, sans-serif; font-size: 12px; color: #aaa; margin-left: 12px;">
      {% for tag in page.tags %}#{{ tag }}{% unless forloop.last %} {% endunless %}{% endfor %}
    </span>
    {% endif %}
  </header>

  {{ content }}

  <footer style="margin-top: 48px; padding-top: 24px; border-top: 1px solid #e0e0e0;">
    <a href="/" style="font-family: Verdana, Arial, sans-serif; font-size: 13px;">&larr; all posts</a>
  </footer>
</article>
